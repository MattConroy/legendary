<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#ff4a4f"/>
      <stop offset="55%" stop-color="#e01a20"/>
      <stop offset="100%" stop-color="#7d0c10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe088"/>
      <stop offset="55%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#d98a0f"/>
    </linearGradient>
    <radialGradient id="dots" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3d0407" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halftone)"/>
  <rect width="512" height="512" fill="url(#dots)"/>

  <!-- Comic burst behind the monogram -->
  <g transform="translate(256 262)" opacity="0.9">
    <g fill="#ffd86b" fill-opacity="0.20">
      <path d="M0,-200 18,-70 -18,-70Z"/>
      <path d="M0,200 18,70 -18,70Z"/>
      <path d="M-200,0 -70,18 -70,-18Z"/>
      <path d="M200,0 70,18 70,-18Z"/>
      <path d="M-141,-141 -40,-58 -58,-40Z"/>
      <path d="M141,141 40,58 58,40Z"/>
      <path d="M141,-141 58,-40 40,-58Z"/>
      <path d="M-141,141 -58,40 -40,58Z"/>
    </g>
  </g>

  <!-- "L" monogram for Legendary -->
  <g filter="url(#drop)">
    <text x="256" y="388" text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-weight="900" font-size="392"
          fill="url(#gold)" stroke="#ffffff" stroke-width="16"
          style="paint-order:stroke; letter-spacing:-8px; font-style:italic">L</text>
  </g>
</svg>
