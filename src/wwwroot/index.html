<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Legendary — Setup Randomiser</title>
    <meta name="description" content="Unofficial one-tap setup randomiser for Legendary: A Marvel Deck Building Game (1–5 players)." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legendary" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Legendary.Companion.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>

    <!-- Boot chrome: shown before the WebAssembly runtime starts, so it lives with
         the markup here rather than in the app stylesheet. -->
    <style>
        .loading-progress {
            position: fixed; inset: 0; margin: auto; width: 8rem; height: 8rem;
        }
        .loading-progress circle {
            fill: none; stroke: var(--border); stroke-width: 0.5rem; transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }
        .loading-progress circle:last-child {
            stroke: var(--marvel);
            stroke-dasharray: calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%;
            transition: stroke-dasharray 0.1s ease;
        }
        .loading-progress-text {
            position: fixed; inset: 0; margin: auto; height: 1rem; text-align: center;
            font-weight: 700; color: var(--muted);
        }
        .loading-progress-text:after { content: var(--blazor-load-percentage-text, "Loading"); }

        #blazor-error-ui {
            background: var(--marvel); color: #fff; bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.3); display: none; left: 0;
            padding: 0.8rem 1.4rem; position: fixed; width: 100%; z-index: 1000;
        }
        #blazor-error-ui .dismiss { cursor: pointer; position: absolute; right: 0.75rem; top: 0.5rem; }
        #blazor-error-ui .reload { color: #fff; text-decoration: underline; }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
